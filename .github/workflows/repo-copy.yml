name: Deploy Repo to Target Server (with rsync)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repo
      uses: actions/checkout@v4

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Copy repo contents with rsync
      run: |
        rsync -avz --delete --exclude='.git/' ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/path/to/target/directory/

    - name: Set permissions (optional)
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "chmod -R 755 /path/to/target/directory/"
