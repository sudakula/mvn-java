name: create-release-artifacts

on:
  push:
    tags:
      - 'v*.*.*'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


jobs:
  build-and-upload:
    name: build and upload artifacts to tag
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Maven
      run: |
        MAVEN_VERSION=3.8.8
        INSTALL_DIR=$RUNNER_TEMP/maven

        curl -L -o apache-maven-${MAVEN_VERSION}-bin.tar.gz https://dlcdn.apache.org/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz
        echo "Extracting Maven..."
        tar -xvzf apache-maven-${MAVEN_VERSION}-bin.tar.gz -C $RUNNER_TEMP


        echo "update env variables..."
        export M2_HOME=$INSTALL_DIR/apache-maven-${MAVEN_VERSION}
        echo "M2_HOME=$INSTALL_DIR/apache-maven-${MAVEN_VERSION}/bin" >> $GITHUB_ENV
        export PATH=$M2_HOME/bin:$PATH
        echo $PATH
        source ~/.bashrc
        echo "verify installation"
        mvn -version


    - name: Build with Maven
      run: |
        export PATH=$M2_HOME/bin:$PATH
        echo $PATH
        source ~/.bashrc
        mvn -f ./pom.xml clean package -DskipTests

    - name: Get Release Upload URL
      id: get_release_url
      run: |
        UPLOAD_URL=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} --jq '.upload_url')
        echo "UPLOAD_URL=${UPLOAD_URL}" >> $GITHUB_ENV
        mkdir -p temp
        ls -al
        mv target/mvn-java-*.jar temp/mvn-java-${{ github.ref_name }}.jar
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Save build artifacts
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ env.UPLOAD_URL }}
        asset_path: temp/mvn-java-${{ github.ref_name }}.jar
        asset_name: mvn-java-${{ github.ref_name }}.jar
        asset_content_type: application/java-archive

  deploy:
    needs: [build-and-upload]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [qa, uat, prod]
    environment:
      name: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: mvn-java-${{ github.ref_name }}.jar

      - name: Deploy to ${{ matrix.environment }}
        run: |
          echo "Deploying to ${{ matrix.environment }}"
          ls -lh mvn-java-${{ github.ref_name }}.jar
          # Example deployment command:
          # scp mvn-java-${{ github.ref_name }}.jar user@server:/deploy/path/
