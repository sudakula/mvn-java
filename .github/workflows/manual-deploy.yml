name: Manual QA Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
      env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - qa1
          - qa2

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      validated_tag: ${{ steps.set-vars.outputs.tag }}
      validated_env: ${{ steps.set-vars.outputs.env }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print job inputs
        id: set-vars
        run: |
          echo "📝 Inputs received:"
          echo "Tag: ${{ inputs.tag }}"
          echo "Environment: ${{ inputs.env }}"
          echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          echo "env=${{ inputs.env }}" >> $GITHUB_OUTPUT

      - name: Fail if not on main
        run: |
          echo "🔒 Verifying branch..."
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "❌ This workflow must be run from the 'main' branch. Current: $GITHUB_REF"
            exit 1
          fi
          echo "✅ Running from main branch."

      - name: Validate tag exists
        run: |
          echo "🔍 Checking if tag '${{ inputs.tag }}' exists..."
          git fetch --tags
          if ! git rev-parse "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "❌ Tag '${{ inputs.tag }}' does not exist."
            exit 1
          fi
          echo "✅ Tag '${{ inputs.tag }}' is valid."

  deploy-qa1:
    name: Deploy to QA1
    runs-on: ubuntu-latest
    needs: validate-tag
    if: github.ref == 'refs/heads/main' && inputs.env == 'qa1'
    steps:
      - name: Deploy logic for QA1
        run: echo "🚀 Deploying tag '${{ inputs.tag }}' to QA1"

  deploy-qa2:
    name: Deploy to QA2
    runs-on: ubuntu-latest
    needs: validate-tag
    if: github.ref == 'refs/heads/main' && inputs.env == 'qa2'
    steps:
      - name: Deploy logic for QA2
        run: echo "🚀 Deploying tag '${{ inputs.tag }}' to QA2"
