name: Manual QA Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
      env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - qa1
          - qa2

jobs:
  block-if-not-main:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - run: |
          echo "❌ This workflow must only be triggered from the 'main' branch."
          exit 1

  validate-tag:
    runs-on: ubuntu-latest
    needs: block-if-not-main
    if: github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ inputs.tag }}
      env: ${{ inputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all tags

      - name: Validate tag exists
        run: |
          echo "🔍 Checking if tag '${{ inputs.tag }}' exists..."
          git fetch --tags
          if ! git rev-parse "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "❌ Tag '${{ inputs.tag }}' does not exist."
            exit 1
          fi
          echo "✅ Tag '${{ inputs.tag }}' is valid."

  deploy-qa1:
    name: Deploy to QA1
    runs-on: ubuntu-latest
    needs: validate-tag
    if: ${{ github.ref == 'refs/heads/main' && inputs.env == 'qa1' }}
    steps:
      - name: Deploy logic for QA1
        run: echo "🚀 Deploying tag '${{ inputs.tag }}' to QA1"

  deploy-qa2:
    name: Deploy to QA2
    runs-on: ubuntu-latest
    needs: validate-tag
    if: ${{ github.ref == 'refs/heads/main' && inputs.env == 'qa2' }}
    steps:
      - name: Deploy logic for QA2
        run: echo "🚀 Deploying tag '${{ inputs.tag }}' to QA2"
